name: Release

# Publishes the GitHub release of a version: the plugin zip, and the notes from the CHANGELOG. GitHub adds the source
# code of the tag. It runs on a version tag: when "Tag release" tags a merged release pull request and starts it, or
# when a tag is pushed by hand. It has no dry run: every CI run shows the notes of the next release on its summary
# page. See docs/releasing.md.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
  # Tag release starts it on the tag: a tag that a workflow pushes starts no workflow by itself.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # Only a tag is published, and it must be the version of plugin.json: the zip is named after it.
      - name: Find the version
        id: version
        run: |
          version=$(python3 -c "import json; print(json.load(open('plugin.json'))['version'])")
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::Release publishes a version tag, not the branch $GITHUB_REF_NAME: see docs/releasing.md."
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but plugin.json says $version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The same checks as the CI: a release is never built from code that fails them.
      - run: uv sync --locked
      # It also builds the plugin zip, which the release publishes.
      - run: uv run --locked python check.py
      # The section of the version in the CHANGELOG, with links to the files of the tag.
      - name: Write the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          uv run python release.py notes "$VERSION" --ref "$GITHUB_REF_NAME" --repository "$GITHUB_REPOSITORY" \
            > release-notes.md
          { echo "## Notes of $VERSION"; echo; cat release-notes.md; } >> "$GITHUB_STEP_SUMMARY"
      # A version with a hyphen, such as 1.1.0-beta, is a pre-release.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$VERSION" dist/*.zip --verify-tag --title "$VERSION" \
            --notes-file release-notes.md $prerelease
