name: Release

# Publishes the release of a version when its release pull request is merged into main: tags the merge commit with
# the version, and publishes the GitHub release with the plugin zip and the notes of the version, in this one run
# (ADR-0003). GitHub adds the source code of the tag. No step replaces what an earlier run did (ADR-0004), so "Re-run
# failed jobs" finishes a run that failed for a cause outside the repository: a re-run uses the commit and the
# ref of the first run. It has no manual start and no trigger on tags. See docs/releasing.md.
# https://docs.github.com/en/actions/how-tos/manage-workflow-runs/re-run-workflows-and-jobs
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Release
    # Only the merge of a release pull request: from a release/ branch (RELEASE_BRANCH_PREFIX of release.py) of this
    # repository, not of a fork. Any other closed pull request skips the job. A person merges the pull request, so
    # the run starts without an approval, although a workflow opened it: GitHub holds the runs that the token of a
    # workflow starts, not those of a person. Seen on the merge of 1.0.2-beta, 2026-11-21.
    # https://docs.github.com/en/actions/concepts/security/github_token
    if: >-
      github.event.pull_request.merged
      && startsWith(github.event.pull_request.head.ref, 'release/')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.event.pull_request.head.ref }}
      MERGE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Checks out the merge commit, installs uv and syncs the environment.
      - uses: $/.github/actions/setup
        with:
          ref: ${{ env.MERGE_COMMIT }}
      # Prepare release named the branch after the version it set. A release pull request edited by hand could set
      # another one: it is refused, and nothing is tagged.
      - name: Check that the branch is named after the version of the plugin
        run: |
          version=$(uv run --locked python release.py version)
          if [ "$BRANCH" != "release/$version" ]; then
            echo "::error::The branch is $BRANCH, but the version of plugin.json is $version: nothing is tagged." \
              "Fix plugin.json on main, and release the next patch version: see \"If something fails\" in" \
              "docs/releasing.md."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      # The section of the version in the CHANGELOG, with links to the files of its tag, also on the summary page of
      # the run. Before the tag, so that a version without notes is refused with nothing tagged.
      - name: Write the notes of the version
        run: |
          uv run --locked python release.py notes "$VERSION" --ref "$VERSION" --repository "$GITHUB_REPOSITORY" \
            > "$RUNNER_TEMP/release-notes.md"
          { echo "## Notes of $VERSION"; echo; cat "$RUNNER_TEMP/release-notes.md"; } >> "$GITHUB_STEP_SUMMARY"
      # The same checks as the CI, which also build the plugin zip that the release publishes: a release is never
      # built from code that fails them. Before the tag too.
      - run: uv run --locked python check.py
      # The tag of the version, on the merge commit. A re-run finds the tag of the first run on it, and goes on. A tag
      # of the version on another commit never moves: the run fails.
      - name: Tag the merge commit
        run: |
          # Nothing if the tag does not exist. Else "<commit>\trefs/tags/<version>", then for an annotated tag
          # "<commit>\trefs/tags/<version>^{}": the commit of the tag is on the last line.
          remote_tag=$(git ls-remote origin "refs/tags/$VERSION" "refs/tags/$VERSION^{}")
          tag_commit=$(echo "$remote_tag" | tail -n 1 | cut -f 1)
          if [ -z "$tag_commit" ]; then
            git tag "$VERSION" "$MERGE_COMMIT"
            git push origin "refs/tags/$VERSION"
            echo "Tagged the merge commit $MERGE_COMMIT with $VERSION."
          elif [ "$tag_commit" = "$MERGE_COMMIT" ]; then
            echo "The tag $VERSION is on the merge commit $MERGE_COMMIT already: nothing to tag."
          else
            echo "::error::The tag $VERSION is on the commit $tag_commit, not on the merge commit $MERGE_COMMIT, and" \
              "a tag never moves: nothing is published. Release the next patch version: see \"If something fails\"" \
              "in docs/releasing.md."
            exit 1
          fi
      # The release of the version, with the plugin zip and the notes, as a pre-release when the version is one. A
      # re-run finds the release of the first run, and publishes nothing again.
      - name: Publish the release
        run: |
          # This endpoint gives only a published release. When it fails for another reason than a missing release,
          # gh release create fails too: it refuses to replace a published release.
          # https://docs.github.com/en/rest/releases/releases#get-a-release-by-tag-name
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION" --silent 2> /dev/null; then
            echo "The release $VERSION is published already: nothing to publish."
            exit 0
          fi
          prerelease=$(uv run --locked python release.py is-pre-release "$VERSION")
          # With assets, gh makes a draft, uploads them, then publishes it, and deletes the draft if a step fails.
          # https://cli.github.com/manual/gh_release_create, and the code of gh 2.102.0:
          # https://github.com/cli/cli/blob/v2.102.0/pkg/cmd/release/create/create.go
          gh release create "$VERSION" dist/*.zip --verify-tag --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease="$prerelease"
