name: Prepare release

# Run it from the Actions tab, with the version to release. release.py checks that it can prepare the version, sets
# it in every file and turns the "## Unreleased" section of the CHANGELOG into the section of the version. Then the
# workflow runs the checks, and opens the release pull request release/<version>, with its checklist and its notes.
# GitHub holds the CI run of that pull request until the maintainer approves it: a pull request that the token of a
# workflow opens starts no run by itself. Merging it releases the version: see release.yml and docs/releasing.md.
# https://docs.github.com/en/actions/concepts/security/github_token
on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release, such as 1.1.0, or 1.1.0-beta for a pre-release"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: Open the release pull request
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      BRANCH: release/${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Checks out main, installs uv and syncs the environment.
      - uses: $/.github/actions/setup
        with:
          ref: main
      # release.py refuses a version it cannot prepare, and says why, before it changes any file: see
      # docs/releasing.md. It reads the tags and the branches of origin.
      - name: Set the version and date the CHANGELOG
        run: |
          uv run python release.py prepare "$VERSION"
          uv lock
      # The same checks as the CI, before anything is pushed.
      - run: uv sync --locked
      - run: uv run --locked python check.py
      - name: Push the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -a -m "Release $VERSION"
          git push origin "$BRANCH"
      # The checklist of the runbook, and the notes of the version, with links to the files of the branch.
      - name: Open the pull request
        run: |
          uv run --locked python release.py notes "$VERSION" --ref "$BRANCH" --repository "$GITHUB_REPOSITORY" \
            > "$RUNNER_TEMP/release-notes.md"
          docs="https://github.com/$GITHUB_REPOSITORY/blob/$BRANCH/docs"
          {
            echo "Prepared by the Prepare release workflow. Merging it tags \`$VERSION\` and publishes its release,"
            echo "as the [runbook]($docs/releasing.md#release-a-version) says. While it is open, merge nothing else"
            echo "into \`main\`."
            echo
            echo "## Before merging"
            echo
            echo "- [ ] **The CI:** approve its run, and it passes. GitHub holds the CI of a pull request that a"
            echo "  workflow opened until you approve it: click **Awaiting approval**, then"
            echo "  **Approve workflows to run**."
            echo "- [ ] **The release review** of everything since the tag of the last release has nothing open."
            echo "- [ ] **The integration tests** pass on this branch, on the test DSS, with \`install_plugin: true\`:"
            echo "  see [integration tests]($docs/integration-tests.md)."
            echo "- [ ] **The notes** below read well. To change them, edit the section of \`$VERSION\` in"
            echo "  \`CHANGELOG.md\` on this branch."
            echo
            echo "## Notes of $VERSION"
            echo
            cat "$RUNNER_TEMP/release-notes.md"
          } > "$RUNNER_TEMP/pull-request.md"
          gh pr create --base main --head "$BRANCH" --title "Release $VERSION" \
            --body-file "$RUNNER_TEMP/pull-request.md"
