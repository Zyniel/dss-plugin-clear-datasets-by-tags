name: CI

on:
  # Only on main: the run of each merge gives the CI badge of the README and the notes of the next release. On another
  # branch, the pull_request run of its pull request runs the same jobs, and a push run would run them a second time.
  # A branch with no pull request gets no run: open a draft pull request.
  push:
    branches: [main]
  pull_request:
    # The types of a pull_request run by default, and a label added or removed: the label no-changelog decides whether
    # the notes of the next release are checked. Every job runs again. A required check counts the last pull_request
    # run of the pull request: when it fails, the merge is blocked, and the run that a label starts replaces it. Seen
    # on pull request #54, 2026-11-22. On a release pull request, which Prepare release opens, the run waits until the
    # maintainer approves it, and gives the required checks: no workflow starts the CI.
    # https://docs.github.com/en/actions/concepts/security/github_token
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  checks:
    name: Lint, types and plugin zip
    runs-on: ubuntu-latest
    steps:
      # Checks out, installs uv and syncs the environment. Python 3.9 comes from .python-version: the version DSS 13
      # runs the plugin with.
      - uses: $/.github/actions/setup
        with:
          # The commit of the run and its parents: the check of the notes of a pull request needs its base.
          fetch-depth: 2
      # The notes of the next release, on the summary page of every run, before the checks: they show even when a
      # check fails. Their links point to the files of the commit of the run.
      - name: Write the notes of the next release
        run: |
          {
            echo "## Notes of the next release"
            echo
            uv run --locked python release.py next-release-notes --ref "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"
          } >> "$GITHUB_STEP_SUMMARY"
      # Prepare release dated the notes of the next release. On its branch, notes of the next release are changes that
      # came later: this step fails, and says what to do. On any other branch, it passes. Not on a pull request from a
      # fork, whose release/ branch is not a release branch of this repository: the next step checks its notes.
      - name: Check that a release branch has no notes of the next release
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          # On a pull request, its branch. On a push, the branch of the run.
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: uv run --locked python release.py check-branch "$BRANCH"
      # A pull request that changes the plugin adds to the notes of the next release: this step fails when it does not,
      # names the files and says what to do. Only on a pull request, as a push has no base to compare with. Not on a
      # release pull request, from a release/ branch of this repository (RELEASE_BRANCH_PREFIX of release.py): Prepare
      # release dated its notes of the next release, which the step above checks. Not with the label no-changelog,
      # which release.py names in its message, for a change that users cannot notice.
      - name: Check that a pull request that changes the plugin adds to the notes of the next release
        if: >-
          github.event_name == 'pull_request'
          && !(startsWith(github.head_ref, 'release/') && github.event.pull_request.head.repo.full_name == github.repository)
          && !contains(github.event.pull_request.labels.*.name, 'no-changelog')
        # A pull_request run checks out the merge of the pull request into its base, whose first parent is the base:
        # what the merge changes is what the pull request changes.
        # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#pull_request
        run: uv run --locked python release.py check-pull-request HEAD^1 HEAD
      # Every check but the tests, which the tests jobs run. The plugin zip it builds is kept as an artifact.
      - run: uv run --locked python check.py --no-tests
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-zip
          path: dist/*.zip

  tests:
    name: Tests on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One job for each Python that check.py tests, which `check.py --help` lists: it fails on any other. The name
        # of each job is a required check of `main`.
        python: ["3.9", "3.13"]
    steps:
      # The environment of the project, on the Python of .python-version, as on your machine.
      - uses: $/.github/actions/setup
      # Only the tests, on the Python of the job. On another Python than the one of the project, check.py runs
      # them in an environment of their own.
      - run: uv run --locked python check.py --tests-on ${{ matrix.python }}
