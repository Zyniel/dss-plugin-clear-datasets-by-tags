name: CI

on:
  push:
  pull_request:
  # Prepare release starts it on the branch of a release pull request, which starts no workflow by itself.
  workflow_dispatch:

jobs:
  checks:
    name: Lint, types and plugin zip
    runs-on: ubuntu-latest
    steps:
      # Checks out, installs uv and syncs the environment. Python 3.9 comes from .python-version: the version DSS 13
      # runs the plugin with.
      - uses: $/.github/actions/setup
      # Ruff, ruff format, mypy, mypy for each runnable and the plugin zip. The tests job runs pytest.
      - run: uv run --locked python check.py --no-tests
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-zip
          path: dist/*.zip

  tests:
    name: Tests on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is what DSS 13 runs. The newer one shows the code keeps working after a DSS upgrade.
        python: ["3.9", "3.13"]
    steps:
      # The environment on the Python of the matrix, which the setup step gives to every uv command after it.
      - uses: $/.github/actions/setup
        with:
          python: ${{ matrix.python }}
      - run: uv run --locked pytest
