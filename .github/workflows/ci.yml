name: CI

on:
  push:
  pull_request:
  # Prepare release starts it on the branch of a release pull request, which starts no workflow by itself.
  workflow_dispatch:

jobs:
  checks:
    name: Lint, types and plugin zip
    runs-on: ubuntu-latest
    steps:
      # Checks out, installs uv and syncs the environment. Python 3.9 comes from .python-version: the version DSS 13
      # runs the plugin with.
      - uses: $/.github/actions/setup
      # Every check but the tests, which the tests jobs run. The plugin zip it builds is kept as an artifact.
      - run: uv run --locked python check.py --no-tests
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-zip
          path: dist/*.zip

  tests:
    name: Tests on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One job for each Python that check.py tests, which `check.py --help` lists: it fails on any other. The name
        # of each job is a required check of `main`.
        python: ["3.9", "3.13"]
    steps:
      # The environment of the project, on the Python of .python-version, as on your machine.
      - uses: $/.github/actions/setup
      # Only the tests, on the Python of the job. On another Python than the one of the project, check.py runs
      # them in an environment of their own.
      - run: uv run --locked python check.py --tests-on ${{ matrix.python }}
