[project]
name = "dss-plugin-clear-datasets-by-tags"
# Keep in line with plugin.json: a test checks that both versions match.
version = "1.0.1-beta"
license = "MIT"
# DSS 13 runs the plugin in its built-in Python 3.9 environment.
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
# mypy 2 can no longer check code against Python 3.9, the version DSS 13 runs.
dev = ["mypy>=1.19,<2", "pytest", "ruff"]
# The DSS API client, only for the integration tests on a real DSS 13: see docs/integration-tests.md.
integration = ["dataiku-api-client>=13.4,<14"]
# Playwright, which downloads its own Chromium, and Pillow, only for the screenshot tests: see docs/screenshots.md.
# The last versions for Python 3.9: Playwright 1.61 and Pillow 12 need Python 3.10, and greenlet 3.2.5, which
# Playwright needs, has no wheel for Python 3.9 on Windows. The lock file then has one version of each: every refresh
# has the same Chromium.
screenshots = ["greenlet<3.2.5", "pillow<12", "playwright<1.61"]

# uv build would make a Python wheel, of no use in DSS: build_plugin_zip.py stops it with a message.
# Build the plugin zip with: uv run python build_plugin_zip.py
[build-system]
requires = []
build-backend = "build_plugin_zip"
backend-path = ["."]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["python-lib", "tests"]
testpaths = ["tests"]
# Test files of different folders can have the same name, such as tests/core/test_options.py and
# tests/macros/clear_datasets_by_tags/test_options.py.
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py39"
line-length = 120
src = ["python-lib", "tests"]

# The conventions ruff cannot check are in CODING_STANDARDS.md.
[tool.ruff.lint]
select = ["B", "C4", "D", "E", "F", "I", "N", "PERF", "PIE", "PT", "RET", "RUF", "SIM", "UP", "W"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Each method only calls the function of the same name, and MaintenanceMacro documents it.
"python-lib/macros/*/macro.py" = ["D102"]
# Ruff cannot tell a helper from a test. CODING_STANDARDS.md asks for a docstring on each helper, none on a test.
"tests/**/test_*.py" = ["D101", "D102", "D103", "D105", "D107"]
# Each fake method stands in for the DSS method of the same name. Its class says how it differs.
"tests/support/fakes.py" = ["D102", "D105", "D107"]

[tool.mypy]
python_version = "3.9"
strict = true
mypy_path = "python-lib:tests"
explicit_package_bases = true
disallow_subclassing_any = false
# The runnables all have the same file name, so check.py runs mypy on them one at a time.
files = ["python-lib", "resource", "tests", "build_plugin_zip.py", "check.py", "release.py"]

[[tool.mypy.overrides]]
module = ["dataiku", "dataiku.*", "dataikuapi", "dataikuapi.*", "PIL", "PIL.*", "playwright", "playwright.*"]
ignore_missing_imports = true
